spring.application.name=eschool
server.port=8082

# =========================================
# POSTGRESQL - NEON DB
# =========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================
# HIKARI CONNECTION POOL
# =========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# =========================================
# JPA / HIBERNATE
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================
# LOGGING
# =========================================
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=TRACE
logging.level.com.fasterxml.jackson=TRACE


# =========================================
# EN  LOCAL  OUI  MAIS PAS EN PRODUCTION
# =========================================
#server.error.include-message=always
#server.error.include-stacktrace=always

# =========================================
# EN  LOCAL  OUI  MAIS PAS EN PRODUCTION
# =========================================
server.error.include-message=never
server.error.include-stacktrace=never


# =========================================
# JACKSON JSON
# =========================================
spring.jackson.serialization.indent-output=true

# =========================================
# FILE UPLOAD
# =========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# =========================================
# SUPABASE STORAGE
# =========================================
supabase.url=${SUPABASE_URL}
supabase.storage-url=${SUPABASE_STORAGE_URL}
supabase.bucket=${SUPABASE_BUCKET}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}

# =========================================
# RESEND EMAIL
# =========================================
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

# =========================================
# FRONTEND
# =========================================
app.front-url=${APP_FRONT_URL}

# =========================================
# TASK SCHEDULING
# =========================================
spring.task.scheduling.pool.size=5